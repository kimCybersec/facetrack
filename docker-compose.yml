version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facetrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Rkim2346?}
      POSTGRES_DB: ${POSTGRES_DB:-facetrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-facetrack} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - facetrack_network

  redis:
    image: redis:7-alpine
    container_name: facetrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - facetrack_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: facetrack-backend
    restart: unless-stopped
    # Use host network for multicast discovery
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Rkim2346?}
      POSTGRES_DB: ${POSTGRES_DB:-facetrack}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      DISCOVERY_SUBNET: ${DISCOVERY_SUBNET:-172.16.0.0/20}
      DEFAULT_CAMERA_USER: ${DEFAULT_CAMERA_USER:-admin}
      DEFAULT_CAMERA_PASSWORD: ${DEFAULT_CAMERA_PASSWORD:-}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.65}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
    volumes:
      - enrollment_photos:/app/storage/enrollment_photos
    # Remove ports binding when using host network
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: facetrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - facetrack_network

networks:
  facetrack_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  enrollment_photos: